[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "kernos-sdk"
version = "0.1.0"
description = "Reasoning worker, kernel client and evaluation harness for Kernos."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Kernos contributors" }]
keywords = ["kernos", "agents", "automation", "worker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.3.0,<2"]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.6",
  "mypy==2.3.1",
  "build==1.6.0",
]

[project.scripts]
kernos-worker = "kernos.worker:main"
kernos-eval = "kernos.eval:main"

[project.urls]
Homepage = "https://github.com/rhs2/kernos"
Documentation = "https://rhs2.github.io/kernos/reference/python-sdk/"

[tool.hatch.build.targets.wheel]
packages = ["src/kernos"]

[tool.hatch.build.targets.sdist]
include = ["src/kernos", "tests", "README.md", "NOTES.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["kernos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:kernos"]

[tool.mypy]
python_version = "3.10"
packages = ["kernos"]
mypy_path = "src"
strict = true
warn_unreachable = true
ignore_missing_imports = true
